<meta property="og:title" content="Invista em Maragogi | Referência Capital" />

<style>
:root{
  --primary:#224239; --auxiliary:#BA9356; --bg-mint:#D4FFE0; --bg:#FFFFFF;
  --type:#232323; --muted:#737373; --card:#FAFAFA; --border:#E0E0E0;
  --destructive:#EF4444; --accent:#BA9356; --wa:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--type);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hidden{display:none !important}
#wbg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
#app{position:relative;z-index:1}
.wrap{min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px}
.fade-in{animation:fadeIn .55s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes buttonPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes buttonPulseWA{0%,100%{box-shadow:0 0 35px rgba(37,211,102,.6),0 4px 20px rgba(0,0,0,.2)}50%{box-shadow:0 0 55px rgba(37,211,102,.85),0 4px 20px rgba(0,0,0,.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* Painel de vidro (usado sobre o fundo imersivo) */
.glass{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;padding:26px 22px;border-radius:26px;
  background:rgba(255,255,255,.74);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 26px 70px rgba(16,38,33,.32)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.94)}}
.glass-welcome{max-width:520px;display:flex;flex-direction:column;align-items:center;padding:30px 24px}
.wrap-welcome{padding:32px 16px}
.glass-form{max-width:460px}
.glass-result{max-width:600px;padding:28px 22px}
body.immersive #qHeader{background:rgba(255,255,255,.72)}

/* Welcome */
.previa{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 14px;border-radius:999px;background:rgba(122,31,31,.08);border:1px solid rgba(122,31,31,.35);color:#7a1f1f;font-size:12px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(34,66,57,.08);border:1px solid rgba(34,66,57,.19);margin-bottom:20px}
.badge span{font-size:13px;font-weight:600;color:var(--primary)}
.badge img{width:20px;height:16px;object-fit:contain}
h1.hero{text-align:center;margin-bottom:20px;max-width:360px;line-height:1.15}
h1.hero .l1{display:block;font-weight:700;font-size:1.5rem;color:var(--primary);letter-spacing:-.02em}
h1.hero .l2{display:block;margin-top:2px}
h1.hero .gold{font-weight:800;font-size:1.85rem;color:var(--auxiliary)}
h1.hero .l3{display:block;font-weight:700;font-size:1.5rem;color:var(--primary);margin-top:2px}
@media(min-width:640px){
  h1.hero{max-width:900px;margin-bottom:32px}
  h1.hero .l1,h1.hero .l3{font-size:2.25rem}
  h1.hero .gold{font-size:2.9rem}
}
.sub1{font-size:15px;font-weight:500;color:rgba(35,35,35,.72);margin-bottom:6px;text-align:center;max-width:460px}
.sub2{font-size:13px;color:rgba(35,35,35,.52);margin-bottom:24px;text-align:center;max-width:440px}
.benefits{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-bottom:24px}
.benefit{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border-radius:12px;background:rgba(212,255,224,.35);border:1px solid var(--bg-mint)}
.benefit span{font-size:14px;font-weight:500;color:rgba(35,35,35,.66)}
@media(min-width:640px){.benefits{flex-direction:row;max-width:none;padding:16px 24px;border-radius:16px;background:rgba(212,255,224,.28);border:1px solid var(--bg-mint)}
.benefit{background:none;border:none;padding:0}}
.btn-gold{width:100%;max-width:340px;padding:15px 24px;font-weight:700;font-size:17px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#BA9356 0%,#d4ab6a 50%,#BA9356 100%);box-shadow:0 0 25px rgba(186,147,86,.31),0 4px 20px rgba(0,0,0,.15);border:1px solid rgba(186,147,86,.38);animation:buttonPulse 2s ease-in-out infinite;transition:all .3s}
.btn-gold:hover{filter:brightness(1.05);animation:none}
.btn-gold:disabled{opacity:.7}
.legal{margin-top:20px;font-size:11px;color:rgba(35,35,35,.42);max-width:360px;text-align:center;line-height:1.5}
.logo-foot{margin-top:22px;height:28px;width:auto;opacity:.6}

/* Progress header */
#qHeader{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);padding:16px 16px 8px}
.hdr-inner{max-width:576px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pbar-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pbar{height:6px;width:100%;border-radius:999px;background:#EDEDED;overflow:hidden}
.pbar > div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),#2d7a62);transition:width .4s ease}
.back-btn{display:flex;align-items:center;gap:4px;color:var(--auxiliary);font-size:14px;font-weight:500}
.back-btn[disabled]{opacity:0;pointer-events:none}

/* Question */
.q-wrap{width:100%;max-width:576px;margin:0 auto;padding-top:calc(var(--qh,96px) + 24px);padding-bottom:40px}
.q-title{font-size:1.4rem;font-weight:700;color:var(--primary);margin-bottom:8px;text-align:center;line-height:1.25}
.q-desc{font-size:14px;color:var(--muted);margin-bottom:24px;text-align:center}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--border);transition:all .2s}
.opt:hover{border-color:var(--auxiliary);box-shadow:0 2px 16px rgba(34,66,57,.08);transform:translateY(-1px)}
.opt.sel{border-color:var(--auxiliary);background:rgba(186,147,86,.08)}
.opt-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.15);color:var(--auxiliary);flex-shrink:0}
.opt span{font-size:15px;font-weight:500;color:var(--type);line-height:1.35}
.streak{text-align:center;margin-top:20px;font-size:12px;color:var(--auxiliary);font-weight:600}
.q-anim-out{opacity:0;transform:scale(.97);filter:blur(6px);transition:all .45s ease-out}

/* Transition */
.trans{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.trans h2{font-size:1.35rem;font-weight:700;color:var(--primary)}
.trans p{font-size:14px;color:var(--muted)}

/* Form */
.form-wrap{width:100%;max-width:420px;margin:0 auto;padding:32px 0}
.form-wrap h2{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:10px;color:var(--primary)}
.form-wrap .lead{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px}
form{display:flex;flex-direction:column;gap:18px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;text-align:left}
.field{position:relative}
.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field .ok{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--auxiliary)}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:15px 44px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:16px;color:var(--type);outline:none;transition:all .2s}
input:focus{border-color:var(--auxiliary);box-shadow:0 0 0 3px rgba(186,147,86,.2)}
input.err{border-color:var(--destructive)}
.err-msg{margin-top:8px;font-size:12px;color:var(--destructive);text-align:left}
.hint{margin-top:10px;font-size:12px;color:rgba(115,115,115,.85);text-align:left}
.phone-row{display:flex;gap:10px}
.cbtn{display:flex;align-items:center;gap:8px;padding:15px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);min-width:112px}
.cbtn .fl{font-size:19px}
.cbtn .dd{font-size:14px;font-weight:500}
.cdrop{position:absolute;top:100%;left:0;margin-top:8px;width:280px;border-radius:12px;background:#fff;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.14);z-index:60;overflow:hidden}
.cdrop .srch{padding:12px;border-bottom:1px solid var(--border)}
.cdrop .srch input{width:100%;padding:10px 12px;border-radius:8px;background:#F2F4F3;border:none;font-size:14px;outline:none}
.clist{max-height:230px;overflow-y:auto}
.citem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;transition:background .15s}
.citem:hover{background:#F2F4F3}
.citem .nm{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .dd{font-size:14px;color:var(--muted);font-weight:500}
.turno-row{display:flex;gap:10px;margin-top:2px}
.turno{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.turno.sel{border-color:var(--auxiliary);background:rgba(186,147,86,.08);color:var(--primary)}
.btn-submit{width:100%;padding:16px;border-radius:12px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#BA9356 0%,#d4ab6a 50%,#BA9356 100%);box-shadow:0 0 25px rgba(186,147,86,.3);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .3s}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

/* Result */
.res{width:100%;max-width:576px;margin:0 auto;padding:8px 0 24px}
.phase{opacity:0;transform:translateY(16px);transition:opacity .7s ease-out,transform .7s ease-out}
.phase.on{opacity:1;transform:none}
.arch{display:inline-flex;flex-direction:column;align-items:center;gap:12px;padding:16px 24px;border-radius:16px;border:1px solid rgba(34,66,57,.3);
  background:linear-gradient(135deg,rgba(34,66,57,.1),var(--card),rgba(186,147,86,.06));box-shadow:0 0 30px rgba(34,66,57,.08),0 4px 20px rgba(0,0,0,.06)}
.arch .lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.arch h2{font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,#C9A45C,#E0B96F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.res h1{font-size:1.75rem;font-weight:700;margin-bottom:14px;line-height:1.2;color:var(--primary)}
.res .pitch{font-size:1.1rem;line-height:1.5;margin-bottom:14px}
.res .pitch b{color:var(--auxiliary)}
.spec{margin-top:22px;padding:16px;border-radius:12px;background:rgba(186,147,86,.08);border:1px solid rgba(186,147,86,.25);display:flex;align-items:center;gap:12px;text-align:left}
.spec .cir{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(186,147,86,.15);color:var(--auxiliary);flex-shrink:0}
.card{padding:24px;border-radius:16px;border:1px solid var(--border);background:var(--card)}
.card.big{border:2px solid rgba(34,66,57,.3);background:linear-gradient(135deg,rgba(34,66,57,.07),var(--card),rgba(186,147,86,.04));box-shadow:0 0 40px rgba(34,66,57,.09),0 8px 32px rgba(0,0,0,.06)}
.card h3{font-size:1.05rem;font-weight:700;color:var(--primary)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--primary)}
.clist2{list-style:none;display:flex;flex-direction:column;gap:12px}
.clist2 li{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5}
.clist2 svg{color:var(--primary);flex-shrink:0;margin-top:2px}
.mb8{margin-bottom:24px}
.foot-logo{display:block;height:22px;width:auto;opacity:.5;margin:16px auto 0}
.btn-wa{width:100%;padding:16px 24px;border-radius:12px;font-weight:700;font-size:16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#25D366 0%,#128C7E 100%);border:1px solid rgba(37,211,102,.5);animation:buttonPulseWA 2s ease-in-out infinite;transition:all .3s}
.btn-wa:disabled{opacity:.8;cursor:wait;animation:none}
.wa-err{margin-top:12px;text-align:center;font-size:14px;color:var(--destructive);font-weight:500}
:focus-visible{outline:3px solid rgba(186,147,86,.5);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

function getCookie(name){
  var m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[2]) : '';
}
function setCookie(name, value, days){
  try{
    var d=new Date(); d.setTime(d.getTime() + (days||90)*864e5);
    var host=location.hostname.replace(/^www\./,'');
    document.cookie = name+'='+encodeURIComponent(value)+';expires='+d.toUTCString()+';path=/;domain=.'+host+';SameSite=Lax';
  }catch(e){}
}

/* lead_id unico da sessao - vai para o leadsLP e para a mensagem reversa */
function newId(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  try{
    if(window.crypto && crypto.getRandomValues){
      var b=new Uint8Array(16); crypto.getRandomValues(b);
      b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
      var h=[]; for(var i=0;i<16;i++){ h.push(('0'+b[i].toString(16)).slice(-2)); }
      return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10,16).join('');
    }
  }catch(e){}
  return 'lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);
}
function getLeadId(){
  var id = ssGet('rc_lead_id');

}

}
function getFbc(){

  var fbclid = new URLSearchParams(location.search).get('fbclid');
  if(fbclid){ v = 'fb.1.'+Date.now()+'.'+fbclid; setCookie('_fbc', v, 90); return v; }
  return '';
}

/* Paid / Organic / Direct */
function detectTrafficSource(){
  var p = new URLSearchParams(location.search);
  if(p.get('fbclid') || p.get('gclid') || p.get('ttclid') || p.get('utm_id')) return 'Paid';
  var src=(p.get('utm_source')||'').toLowerCase(), med=(p.get('utm_medium')||'').toLowerCase();
  if(med.indexOf('cpc')>-1 || med.indexOf('paid')>-1 || med.indexOf('ppc')>-1 || src.indexOf('facebook')>-1 || src.indexOf('instagram')>-1 || src.indexOf('google')>-1 && med.indexOf('cpc')>-1) return 'Paid';
  if(src || med) return 'Organic';
  if(document.referrer && document.referrer.indexOf(location.hostname)<0) return 'Organic';
  return 'Direct';
}
function getFirstTrafficSource(ts){
  var f = lsGet('rc_first_traffic_source');

}

/* utmSource no mesmo formato enviado pelo WPForms: dominio + url completa + campanha */
function buildUtmSource(){
  var p = new URLSearchParams(location.search);
  var parts = [location.hostname.replace(/^www\./,''), location.href];
  var camp = p.get('utm_campaign');
  if(camp) parts.push(camp);
  return parts.join(' ');
}

/* IP publico do visitante (capturado no boot, reaproveitado no submit) */
function initClientIp(){

  fetch('https://ipapi.co/json/').then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ip) CLIENT.ip = d.ip;
    if(d && d.country_code && !formState.detected){
      var found=countries.filter(function(c){ return c.code===d.country_code; })[0];
      if(found){ formState.detected=found; formState.country=found; }
    }
  }).catch(function(){});
}

function renderCountryList(){

    + '<span class="nm">'+c.name+'</span><span class="dd">'+c.ddi+'</span></button>';

      document.getElementById('cDdi').textContent=formState.country.ddi;

function closeDrop(){ formState.dropOpen=false; formState.search=''; document.getElementById('cDrop').classList.add('hidden'); }
function detectCountry(){
  if(location.protocol==='file:') return;
  fetch('https://ipapi.co/json/').then(function(r){ return r.json(); }).then(function(d){
    if(d&&d.ip) CLIENT.ip=d.ip;
    if(!d||!d.country_code) return;
    var found=countries.filter(function(c){ return c.code===d.country_code; })[0];
    if(found && !formState.detected){
      formState.detected=found; formState.country=found;
      var f=document.getElementById('cFlag'), dd=document.getElementById('cDdi'), ph=document.getElementById('fPhone');
      if(f) f.textContent=found.flag; if(dd) dd.textContent=found.ddi;
      if(ph && !ph.value) ph.placeholder=getMask(found.code).ph;
    }
  }).catch(function(){});
}
function wireForm(){

function showErr(id, input, msg){ var e=document.getElementById(id); e.textContent=msg; e.classList.remove('hidden'); if(input) input.classList.add('err'); }

function onSubmitForm(ev){
  ev.preventDefault();
  if(state.submitting) return;
  var nameI=document.getElementById('fName'), phoneI=document.getElementById('fPhone'), emailI=document.getElementById('fEmail');
  var ok=true; var nm=nameI.value.trim();
  if(nm.length<3 || nm.indexOf(' ')<0){ showErr('eName', nameI, 'Informe seu nome completo'); ok=false; } else hideErr('eName', nameI);
  var em=emailI.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ showErr('eEmail', emailI, 'E-mail inválido'); ok=false; } else hideErr('eEmail', emailI);
  var digits=phoneI.value.replace(/\D/g,''); var m=getMask(formState.country.code);
  if(digits.length<m.min){ showErr('ePhone', phoneI, 'Número de telefone inválido'); ok=false; } else hideErr('ePhone', phoneI);
  if(!ok) return;
  var ddi=formState.country.ddi.replace(/\D/g,'');
  submitLead({ name:nm, email:em.toLowerCase(), phone:digits, country:formState.country.name, ddi:formState.country.ddi, phoneE164:'+'+ddi+digits });
}

function submitLead(lead){
  state.submitting=true; state.lead=lead;
  var btn=document.getElementById('submitBtn');
  if(btn){ btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="spin" style="width:20px;height:20px"></i> Analisando...'; icons(); }

  var leadId = getLeadId();
  var ts = detectTrafficSource();
  fireLead(leadId);

  var payload = {
    /* identificacao unica compartilhada entre leadsLP e mensagem reversa */
    lead_id: leadId,

    /* campos no padrao do webhook leadsLP */
    nome: lead.name,
    telefone: lead.phoneE164,
    email: lead.email,
    capacidadeInvestimento: LABELS.parcela[state.answers.parcela] || '',
    utmSource: buildUtmSource(),
    produto: CONFIG.produto || CONFIG.empreendimento,
    user_ip: CLIENT.ip || '',
    _fbc: getFbc(),
    _fbp: getFbp(),
    trafficSource: ts,
    first_traffic_source: getFirstTrafficSource(ts),
    user_agent: navigator.userAgent,

    /* contexto da LP / respostas do quiz */
    empreendimento: CONFIG.empreendimento,
    regiao: CONFIG.regiao,
    origem_lp: CONFIG.origemLp,
    pagina: location.href,
    referrer: document.referrer || '',
    objetivo: state.answers.objetivo || '',
    objetivo_label: LABELS.objetivo[state.answers.objetivo] || '',
    entrada: state.answers.entrada || '',
    entrada_label: LABELS.entrada[state.answers.entrada] || '',
    parcela: state.answers.parcela || '',
    parcela_label: LABELS.parcela[state.answers.parcela] || '',
    interesse_regiao: state.answers.interesse_regiao || '',
    turno: formState.turno || '',
    ddi: lead.ddi,
    pais: lead.country,
    submitted_at: new Date().toISOString()
  };
  var utms=getUTMs(); for(var k in utms){ payload[k]=utms[k]; }
  state.payload=payload;

  var finished=false;
  function done(){ if(finished) return; finished=true; renderResult(); }
  
  /* nao deixa o usuario preso se o webhook demorar */
  var guard = setTimeout(done, 6000);

  if(CONFIG.webhookUrl){
    postWebhook(CONFIG.webhookUrl, payload)
      .then(function(){ clearTimeout(guard); done(); })
      .catch(function(e){ console.error('[leadsLP] falhou:', e); clearTimeout(guard); done(); });
  } else { console.log('[LEAD payload]', payload); clearTimeout(guard); done(); }
}

function extractWaUrl(data){
  var p = Array.isArray(data) ? data[0] : data;
  if(!p) return '';
  if(typeof p === 'string') return p.indexOf('http')===0 ? p : '';
  if(p.data && typeof p.data === 'object') p = p.data;
  var keys = ['redirect_url','redirectUrl','whatsapp_url','whatsappUrl','url','link','wa_link','waLink','short_url'];
  for(var i=0;i<keys.length;i++){ if(p[keys[i]]) return String(p[keys[i]]); }
  /* fallback: numero + mensagem separados */
  if(p.numero || p.phone || p.telefone){
    var num = String(p.numero || p.phone || p.telefone).replace(/\D/g,'');
    var msg = p.mensagem || p.message || p.texto || '';
    return 'https://wa.me/'+num+(msg?('?text='+encodeURIComponent(msg)):'');
  }
  return '';
}

      email: base.email || lead.email || '',
      produto: CONFIG.produto || CONFIG.empreendimento,
      empreendimento: CONFIG.empreendimento,
      regiao: CONFIG.regiao,
      page_url: CONFIG.origemLp,
      capacidadeInvestimento: base.capacidadeInvestimento || '',
      utmSource: base.utmSource || buildUtmSource(),
      trafficSource: base.trafficSource || detectTrafficSource(),
      first_traffic_source: base.first_traffic_source || '',
      user_ip: CLIENT.ip || '',
      user_agent: navigator.userAgent,
      _fbc: getFbc(),
      _fbp: getFbp(),
      pagina: location.href,
      origem_evento: 'botao_whatsapp',
      requested_at: new Date().toISOString()
    };

    postWebhook(CONFIG.reverseWebhookUrl, body)
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var data = {};
        try{ data = JSON.parse(txt); }catch(e){ data = txt; }
        waUrl = extractWaUrl(data);
        waLoading = false;
        updateWa(waUrl ? null : 'Não conseguimos preparar o WhatsApp agora. Toque para tentar novamente.');
      })
      .catch(function(e){

function updateWa(err){

  btn.disabled=waLoading;
  btn.innerHTML = waLoading
    ? '<i data-lucide="loader-2" class="spin" style="width:20px;height:20px"></i> Preparando seu WhatsApp...'
    : '<i data-lucide="message-circle" style="width:20px;height:20px"></i> Falar com meu especialista agora';
  if(e){ if(err){ e.textContent=err; e.classList.remove('hidden'); } else e.classList.add('hidden'); }
  icons();
}

/* ---------- Navegacao ---------- */
function goTo(step){
  state.step=step; window.scrollTo({top:0,behavior:'instant'});
  if(step==='welcome') return renderWelcome();
  if(step.indexOf('step')===0) return renderQuestion(step);
  if(step==='transition') return renderTransition('Montando seu diagnóstico...','Seu perfil está ficando claro.',2600, function(){ goTo('capture'); });
  if(step==='capture') return renderCapture();
}
function startQuiz(){ goTo('step1'); }
function goToPreviousStep(){ var i=STEP_ORDER.indexOf(state.step); if(i>1) goTo(STEP_ORDER[i-1]); }
function answerQuestion(q, value, num){
  state.answers[q.id]=value; state.streak++;
  var i=STEP_ORDER.indexOf(state.step); goTo(STEP_ORDER[i+1]);
}

/* ---------- Boot ---------- */
if(BG_VALUE){
  var wbg=document.getElementById('wbg');
  wbg.style.background=BG_VALUE; wbg.style.backgroundSize='cover'; wbg.style.backgroundPosition='center';
  wbg.style.display='block'; document.body.classList.add('immersive');
}
initPixels();
initClientIp();
getLeadId();
goTo('welcome');
</script>
</body>
</html>
